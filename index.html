<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Music</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>🎵 Mood-Based Music Suggestion</h1>
    <div class="moods">
      <button onclick="showMusic('happy')">😊 Happy</button>
      <button onclick="showMusic('sad')">😢 Sad</button>
      <button onclick="showMusic('angry')">😡 Angry</button>
      <button onclick="showMusic('calm')">😌 Calm</button>
    </div>
    <div id="musicList" class="music-list"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
